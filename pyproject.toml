[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telecursor"
version = "0.1.0"
description = "Secure Telegram bridge for the local Cursor Agent CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Telecursor contributors" }]
keywords = ["telegram", "cursor", "agent", "aiogram", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "aiogram>=3.13,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "aiofiles>=24.1,<25",
]

[project.urls]
Homepage = "https://github.com/YOUR_USER/telecursor"
Repository = "https://github.com/YOUR_USER/telecursor"
Issues = "https://github.com/YOUR_USER/telecursor/issues"

[project.scripts]
telecursor = "main:main"

[tool.setuptools]
py-modules = [
  "main",
  "config",
  "setup_cli",
  "daemon",
  "handlers",
  "agent_runner",
  "cursor_info",
  "middleware",
  "session",
  "streaming",
  "env_store",
]
